# Build and Push cpp-microservice-template to GHCR
#
# This workflow builds the cpp-microservice-template using the FluxOpsNerd base images
# and pushes the resulting image to GitHub Container Registry (GHCR).
#
# Base images used:
# - ghcr.io/fluxopsnerd/alpine-cpp-builder:latest (build stage)
# - ghcr.io/fluxopsnerd/alpine-cpp-runtime:latest (runtime stage)
#
# Service image published to: ghcr.io/fluxopsnerd/cpp-microservice-template

name: Build and Push to GHCR

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'Makefile'
      - 'src/**'
      - 'include/**'
      - 'config/**'
      - 'scripts/**'
      - '.github/workflows/build-and-push.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'Makefile'
      - 'src/**'
      - 'include/**'
      - 'config/**'
      - 'scripts/**'
      - '.github/workflows/build-and-push.yml'
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: 'Optional tag suffix (e.g., -rc1, -beta, -test)'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: cpp-microservice-template
  ORG: fluxopsnerd

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Login to GHCR for pulling private base images
    # Uses GHCR_PULL_TOKEN which has read:packages + write:packages scope
    - name: Log in to GHCR (for pulling private base images)
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
      # Falls back to GITHUB_TOKEN if GHCR_PULL_TOKEN not set
      # GHCR_PULL_TOKEN allows pulling private packages from other repos
      # GITHUB_TOKEN only works for packages in current repo

    - name: Determine Dockerfile to use
      id: dockerfile
      run: |
        echo "dockerfile=Dockerfile" >> $GITHUB_OUTPUT
        echo "Using Dockerfile"


    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value=${{ github.run_number }}${{ inputs.tag_suffix }}
          type=raw,value=main,enable={{is_default_branch}}

    - name: Build and push ${{ env.IMAGE_NAME }}
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        file: ${{ steps.dockerfile.outputs.dockerfile }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.IMAGE_NAME }}:buildcache
        cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

    - name: Verify image
      run: |
        echo "Verifying built image..."
        docker pull ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.IMAGE_NAME }}:latest
        docker inspect ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.IMAGE_NAME }}:latest | grep -E '"Created"|"Size"'
        echo "Image verification complete"

    - name: Test image
      run: |
        echo "Testing image can run..."
        docker run --rm ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.IMAGE_NAME }}:latest /usr/local/bin/virtual-device-manager --version || echo "Version check not supported, continuing..."
        echo "Image test complete"
